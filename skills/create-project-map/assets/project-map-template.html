<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{PROJECT_SUMMARY}}">
  <title>{{PROJECT_TITLE}} — Project Map</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.0/dist/cytoscape.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0f;
      --surface: #101118;
      --surface-2: #171922;
      --line: #2a2d38;
      --line-strong: #3c4150;
      --text: #f1f2f5;
      --soft: #b5b8c2;
      --muted: #7e8391;
      --focus: #f0bd45;
      --focus-soft: rgba(240, 189, 69, .14);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { min-width: 320px; }
    button, input, a { font: inherit; }
    button, input, .button-link {
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
    }
    button, .button-link { cursor: pointer; }
    button:hover, .button-link:hover { border-color: #646a7b; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .topbar {
      min-height: 68px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: #0c0d12;
    }
    .brand { min-width: 0; }
    .brand strong { display: block; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
    .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .toolbar { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .toolbar input { width: 220px; height: 36px; padding: 0 11px; }
    .toolbar button, .button-link { height: 36px; padding: 0 12px; display: inline-flex; align-items: center; text-decoration: none; }
    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 370px; }
    .map-panel { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #cy { position: absolute; inset: 0; }
    .summary {
      position: absolute;
      z-index: 3;
      top: 18px;
      left: 18px;
      max-width: min(760px, calc(100% - 36px));
      pointer-events: none;
    }
    .eyebrow { margin: 0 0 7px; color: var(--focus); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(21px, 2.3vw, 31px); line-height: 1.15; }
    .summary > p:last-of-type { margin: 8px 0 0; color: var(--soft); font-size: 12px; line-height: 1.55; }
    .legend {
      margin-top: 12px;
      padding: 8px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      width: fit-content;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(12, 13, 18, .93);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--soft); font-size: 9px; white-space: nowrap; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--color); }
    .hint { position: absolute; right: 16px; bottom: 14px; color: var(--muted); font-size: 9px; pointer-events: none; }
    .loading { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 30px; background: var(--bg); color: var(--soft); text-align: center; }
    .loading.hidden { display: none; }
    .loading strong { display: block; margin-bottom: 8px; color: var(--text); }
    .inspector { min-width: 0; min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--surface); }
    .flow-nav { padding: 15px 16px; border-bottom: 1px solid var(--line); background: #0d0f15; }
    .section-label { margin: 0 0 9px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .mode-controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .mode-button { min-height: 32px; padding: 6px 10px; font-size: 10px; }
    .mode-button[aria-pressed="true"] { border-color: rgba(240, 189, 69, .6); background: var(--focus-soft); color: #f5d477; }
    .flow-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .flow-button { min-height: 62px; padding: 10px 12px; display: grid; align-content: center; gap: 4px; text-align: left; }
    .flow-button strong { font-size: 12px; }
    .flow-button span { color: var(--muted); font-size: 9px; line-height: 1.45; }
    .flow-button[aria-pressed="true"] { border-color: rgba(240, 189, 69, .6); background: var(--focus-soft); }
    .flow-button[aria-pressed="true"] strong { color: #f5d477; }
    .filter-controls { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .filter-field { min-width: 0; display: grid; gap: 5px; color: var(--muted); font-size: 9px; }
    .filter-field select { width: 100%; min-width: 0; height: 31px; padding: 0 7px; font-size: 10px; }
    .toggle-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 9px; }
    .toggle { min-width: 0; display: flex; align-items: center; gap: 6px; color: var(--soft); font-size: 9px; line-height: 1.35; }
    .toggle input { accent-color: var(--focus); }
    .node-inventory { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .inventory-list { display: grid; gap: 6px; max-height: 230px; overflow: auto; }
    .inventory-item { width: 100%; min-height: 43px; padding: 7px 9px; display: grid; gap: 3px; text-align: left; }
    .inventory-item[aria-current="true"] { border-color: rgba(240, 189, 69, .7); background: var(--focus-soft); }
    .inventory-item strong { overflow: hidden; color: var(--text); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .inventory-item span { overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .inventory-empty { margin: 0; color: var(--muted); font-size: 10px; }
    .comparison-notice { margin: 0 0 14px; padding: 8px 9px; border: 1px solid rgba(240, 189, 69, .4); border-radius: 7px; color: #f5d477; font-size: 10px; line-height: 1.45; }
    .legend-entry i { flex: 0 0 auto; width: 14px; height: 14px; display: inline-grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface-2); color: var(--text); font-style: normal; font-size: 9px; }
    .legend-entry.category i { border: 0; background: var(--color); }
    .legend-entry.pattern i { width: auto; min-width: 14px; padding: 0 3px; border-radius: 4px; }
    .coverage-unknown { color: #f5d477; }
    .content-anchor { height: 1px; scroll-margin-top: 12px; }
    .detail-header { padding: 18px; border-bottom: 1px solid var(--line); }
    .detail-kicker { margin: 0 0 9px; color: var(--muted); font-size: 10px; letter-spacing: .1em; }
    .detail-header h2 { margin: 0; font-size: 22px; line-height: 1.25; }
    .chips { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 7px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--soft); font-size: 9px; }
    .detail-body { padding: 18px; }
    .description { margin: 0 0 20px; color: #d5d7de; font-size: 13px; line-height: 1.7; }
    .detail-section { margin: 0 0 22px; }
    .detail-section h3 { margin: 0 0 9px; color: var(--muted); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .detail-section ul { margin: 0; padding: 0; list-style: none; }
    .detail-section li { margin-bottom: 7px; color: var(--soft); font-size: 11px; line-height: 1.55; }
    .stage { margin-bottom: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #13151c; }
    .stage strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .stage p { margin: 0; color: var(--soft); font-size: 10px; line-height: 1.55; }
    .relation { width: 100%; min-height: 38px; margin-bottom: 6px; padding: 8px 9px; display: flex; justify-content: space-between; gap: 10px; text-align: left; }
    .relation small { color: var(--muted); }
    .large-flow-hint { position: absolute; right: 16px; bottom: 34px; z-index: 3; color: var(--focus); font-size: 10px; pointer-events: none; }
    .large-flow-hint:empty { display: none; }
    @media (max-width: 900px) {
      html, body { height: auto; }
      .app { height: auto; overflow: visible; }
      .topbar { flex-wrap: wrap; }
      .toolbar { width: 100%; margin-left: 0; }
      .toolbar input { flex: 1; width: auto; }
      .workspace { display: block; }
      .map-panel { height: 68vh; min-height: 450px; }
      .inspector { overflow: visible; border-left: 0; border-top: 1px solid var(--line); }
      .filter-grid, .toggle-grid { grid-template-columns: repeat(2, minmax(145px, 1fr)); overflow-x: auto; }
    }
    @media (max-width: 560px) {
      .topbar { padding: 11px 12px; }
      .map-panel { min-height: 450px; }
      .summary { top: 14px; left: 14px; max-width: calc(100% - 28px); }
      .hint { display: none; }
      .toolbar { flex-wrap: wrap; }
      .toolbar input { flex: 1 1 100%; }
      .mode-controls, .filter-grid, .toggle-grid { overflow-x: auto; flex-wrap: nowrap; }
      .mode-controls { padding-bottom: 3px; }
      .filter-grid, .toggle-grid { display: flex; }
      .filter-field { flex: 0 0 145px; }
      .toggle { flex: 0 0 145px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>{{PROJECT_TITLE}}</strong>
        <span>Living architecture map</span>
      </div>
      <div class="toolbar" aria-label="Map controls">
        <label for="nodeSearch" hidden>Search nodes</label>
        <input id="nodeSearch" type="search" placeholder="Search nodes, responsibilities, paths">
        <button id="fitButton" type="button">Fit map</button>
        <a class="button-link" href="{{DATA_FILENAME}}">JSON</a>
      </div>
    </header>
    <main class="workspace">
      <section class="map-panel" aria-labelledby="mapTitle">
        <div class="summary">
          <p class="eyebrow">Project architecture</p>
          <h1 id="mapTitle">{{PROJECT_TITLE}}</h1>
          <p>{{PROJECT_SUMMARY}}</p>
          <div class="legend" id="legend" aria-label="Node categories"></div>
        </div>
        <div id="cy" role="application" aria-label="Interactive project dependency map"></div>
        <div class="large-flow-hint" id="largeFlowHint" aria-live="polite"></div>
        <div class="hint">Drag to pan · Scroll to zoom · Select a node</div>
        <div class="loading" id="loading"><div><strong>Loading project map</strong><span>Preparing architecture data…</span></div></div>
      </section>
      <aside class="inspector" id="inspector" aria-label="Project map details" aria-live="polite" aria-relevant="additions text">
        <nav class="flow-nav" id="flowNav" aria-label="Flow views">
          <div class="mode-controls" id="modeControls" role="group" aria-label="Graph mode"></div>
          <div id="flowViews"></div>
          <section class="filter-controls" id="filterControls" aria-label="Map filters" hidden>
            <p class="section-label">Filters and comparison</p>
            <div class="filter-grid">
              <label class="filter-field" for="statusFilter">Lifecycle status
                <select id="statusFilter">
                  <option value="all">All statuses</option>
                  <option value="planned">Planned</option>
                  <option value="implemented">Implemented</option>
                  <option value="deprecated">Deprecated</option>
                </select>
              </label>
              <label class="filter-field" for="categoryFilter">Category
                <select id="categoryFilter"><option value="all">All categories</option></select>
              </label>
              <label class="filter-field" for="changeFilter">Change
                <select id="changeFilter">
                  <option value="all">All changes</option>
                  <option value="existing">Existing</option>
                  <option value="inherited">Inherited</option>
                  <option value="changed">Changed</option>
                  <option value="added">Added</option>
                  <option value="replaced">Replaced</option>
                  <option value="removed">Removed</option>
                </select>
              </label>
              <label class="filter-field" for="snapshotSelect">Snapshot
                <select id="snapshotSelect"></select>
              </label>
              <label class="filter-field" for="comparisonSelect">Comparison
                <select id="comparisonSelect"></select>
              </label>
            </div>
            <div class="toggle-grid">
              <label class="toggle"><input id="showLabelsToggle" type="checkbox" checked> Show labels</label>
              <label class="toggle"><input id="showDeprecatedToggle" type="checkbox" checked> Show deprecated</label>
              <label class="toggle"><input id="showChangesOnlyToggle" type="checkbox"> Changes only</label>
            </div>
          </section>
          <section class="node-inventory" id="nodeInventory" aria-label="Node inventory"></section>
        </nav>
        <div class="content-anchor" id="contentAnchor" aria-hidden="true"></div>
        <header class="detail-header">
          <p class="detail-kicker" id="detailKicker">Project index</p>
          <h2 id="detailTitle">All relationships</h2>
          <div class="chips" id="detailChips"></div>
        </header>
        <div class="detail-body" id="detailBody"></div>
      </aside>
    </main>
  </div>
  <script>
    (() => {
      const DATA_URL = "{{DATA_FILENAME}}";
      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      let model;
      let cy;
      let state = {
        mode: "dependency",
        flowId: "all",
        selectedNode: "",
        snapshotId: "current",
        comparisonId: "current",
        statusFilter: "all",
        categoryFilter: "all",
        changeFilter: "all",
        searchQuery: "",
        showLabels: true,
        showDeprecated: true,
        showChangesOnly: false,
        comparisonNotice: "",
      };
      let layoutOptions = {name: "preset", fit: false, animate: false};
      let fitCalls = 0;
      let fitCallsAfterSelection = 0;
      let rootMeanY;
      let downstreamMeanY;
      let lastScrollBehavior = "";
      let activeLayout;
      let layoutGeneration = 0;
      let lastFitPadding;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const testMode = new URLSearchParams(location.search).get("test") === "1";
      const byId = (items, id) => items.find((item) => item && item.id === id);
      const list = (title, values) => !values?.length ? "" :
        `<section class="detail-section"><h3>${escapeHtml(title)}</h3><ul>${values.map((value) => `<li>${escapeHtml(value)}</li>`).join("")}</ul></section>`;

      const NODE_KIND_SHAPES = Object.freeze({
        service: "roundrectangle", ui: "rectangle", worker: "hexagon", data: "diamond",
        external: "ellipse", contract: "tag", decision: "octagon", actor: "star",
      });
      const EDGE_KIND_STYLES = Object.freeze({
        calls: {lineStyle: "solid", arrow: "vee", width: 1},
        data: {lineStyle: "solid", arrow: "triangle", width: 1},
        event: {lineStyle: "dashed", arrow: "triangle", width: 1},
        contains: {lineStyle: "solid", arrow: "diamond", width: 1},
        inherits: {lineStyle: "dotted", arrow: "tee", width: 1},
        "depends-on": {lineStyle: "dashed", arrow: "vee", width: 1},
        replaces: {lineStyle: "solid", arrow: "diamond", width: 3},
        unknown: {lineStyle: "dotted", arrow: "circle", width: 1},
      });
      const CHANGE_STYLES = Object.freeze({
        existing: {glyph: "=", borderStyle: "solid", borderWidth: 1},
        inherited: {glyph: "↥", borderStyle: "dashed", borderWidth: 1},
        changed: {glyph: "~", borderStyle: "solid", borderWidth: 3},
        added: {glyph: "+", borderStyle: "solid", borderWidth: 2},
        replaced: {glyph: "⇄", borderStyle: "solid", borderWidth: 3},
        removed: {glyph: "−", borderStyle: "dotted", borderWidth: 1},
      });
      const CHANGE_EDGE_STYLES = Object.freeze({
        existing: {lineStyle: "solid", width: 1},
        inherited: {lineStyle: "dashed", width: 1},
        changed: {lineStyle: "solid", width: 2},
        added: {lineStyle: "solid", width: 1},
        replaced: {lineStyle: "solid", width: 3},
        removed: {lineStyle: "dotted", width: 1},
      });
      const STATUS_STYLES = Object.freeze({
        planned: {borderStyle: "dashed", borderWidth: 2, opacity: 1},
        implemented: {borderStyle: "solid", borderWidth: 1, opacity: 1},
        deprecated: {borderStyle: "dotted", borderWidth: 2, opacity: .5},
      });
      const COMPARISON_SUFFIX = {nodes: "Node", edges: "Edge", flows: "Flow"};
      const CHANGE_ORDER = ["existing", "inherited", "changed", "added", "replaced", "removed"];

      const isObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
      const assertShape = (condition, path, message) => {
        if (!condition) throw new Error(`${path} ${message}`);
      };
      const hasOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
      const V2_NODE_KINDS = new Set(["service", "ui", "worker", "data", "external", "contract", "decision", "actor"]);
      const V2_EDGE_KINDS = new Set(["calls", "data", "event", "contains", "inherits", "depends-on", "replaces", "unknown"]);
      const V2_CHANGE_TYPES = new Set(["existing", "inherited", "changed", "added", "replaced", "removed"]);
      const V2_SNAPSHOT_KINDS = new Set(["version", "baseline", "release", "working"]);

      function requireString(value, path, nonEmpty = false) {
        assertShape(typeof value === "string" && (!nonEmpty || value.trim().length > 0), path,
          nonEmpty ? "must be a non-empty string" : "must be a string");
      }

      function requireStringArray(value, path) {
        assertShape(Array.isArray(value), path, "must be an array");
        value.forEach((entry, index) => requireString(entry, `${path}[${index}]`, true));
      }

      function requireReferences(value, path, allowed) {
        requireStringArray(value, path);
        value.forEach((entry, index) => assertShape(allowed.has(entry), `${path}[${index}]`, `references unknown id '${entry}'`));
      }

      function requireObjectArray(value, path) {
        assertShape(Array.isArray(value), path, "must be an array");
        value.forEach((entry, index) => assertShape(isObject(entry), `${path}[${index}]`, "must be an object"));
      }

      function collectIds(items, path) {
        requireObjectArray(items, path);
        const ids = new Set();
        items.forEach((item, index) => {
          requireString(item.id, `${path}[${index}].id`, true);
          assertShape(!ids.has(item.id), path, `contains duplicate id '${item.id}'`);
          ids.add(item.id);
        });
        return ids;
      }

      function validateV2Snapshots(data) {
        if (!hasOwn(data, "snapshots")) return new Set();
        requireObjectArray(data.snapshots, "snapshots");
        const snapshotIds = collectIds(data.snapshots, "snapshots");
        data.snapshots.forEach((snapshot, index) => {
          const path = `snapshots[${index}]`;
          requireString(snapshot.label, `${path}.label`, true);
          requireString(snapshot.kind, `${path}.kind`, true);
          assertShape(V2_SNAPSHOT_KINDS.has(snapshot.kind), `${path}.kind`, "must be a recognized snapshot kind");
          assertShape(hasOwn(snapshot, "parentId"), `${path}.parentId`, "must be present as null or a known snapshot id");
          assertShape(snapshot.parentId === null || (typeof snapshot.parentId === "string" && snapshotIds.has(snapshot.parentId)),
            `${path}.parentId`, "must be null or a known snapshot id");
        });
        return snapshotIds;
      }

      function validateAnnotations(items, path, allowedIds, allIds, snapshotIds, kindValues) {
        items.forEach((item, index) => {
          const itemPath = `${path}[${index}]`;
          if (kindValues && hasOwn(item, "kind")) {
            requireString(item.kind, `${itemPath}.kind`, true);
            assertShape(kindValues.has(item.kind), `${itemPath}.kind`, "must be a recognized kind");
          }
          if (hasOwn(item, "changeType")) {
            requireString(item.changeType, `${itemPath}.changeType`, true);
            assertShape(V2_CHANGE_TYPES.has(item.changeType), `${itemPath}.changeType`, "must be a recognized change type");
          }
          if (hasOwn(item, "snapshotIds")) requireReferences(item.snapshotIds, `${itemPath}.snapshotIds`, snapshotIds);
          if (hasOwn(item, "replacesId")) {
            requireString(item.replacesId, `${itemPath}.replacesId`, true);
            assertShape(allowedIds.has(item.replacesId), `${itemPath}.replacesId`, "must reference the same collection");
            assertShape(item.changeType === "replaced", `${itemPath}.replacesId`, "is forbidden unless changeType is 'replaced'");
          }
          if (item.changeType === "replaced") {
            assertShape(hasOwn(item, "replacesId"), `${itemPath}.replacesId`, "is required when changeType is 'replaced'");
          }
          if (hasOwn(item, "replacesId")) assertShape(allIds.has(item.replacesId), `${itemPath}.replacesId`, "must reference a known id");
        });
      }

      function validateV2Comparisons(data, snapshotIds, collectionIds) {
        if (!hasOwn(data, "comparisons")) return;
        requireObjectArray(data.comparisons, "comparisons");
        const comparisonIds = new Set();
        const states = ["existing", "inherited", "changed", "added", "replaced", "removed"];
        data.comparisons.forEach((comparison, index) => {
          const path = `comparisons[${index}]`;
          requireString(comparison.id, `${path}.id`, true);
          assertShape(!comparisonIds.has(comparison.id), "comparisons", `contains duplicate id '${comparison.id}'`);
          comparisonIds.add(comparison.id);
          requireString(comparison.fromSnapshotId, `${path}.fromSnapshotId`, true);
          requireString(comparison.toSnapshotId, `${path}.toSnapshotId`, true);
          assertShape(snapshotIds.has(comparison.fromSnapshotId), `${path}.fromSnapshotId`, "references an unknown snapshot");
          assertShape(snapshotIds.has(comparison.toSnapshotId), `${path}.toSnapshotId`, "references an unknown snapshot");
          assertShape(comparison.fromSnapshotId !== comparison.toSnapshotId, path, "fromSnapshotId and toSnapshotId must differ");
          if (hasOwn(comparison, "summary")) requireString(comparison.summary, `${path}.summary`);
          [
            ["nodes", "Node"],
            ["edges", "Edge"],
            ["flows", "Flow"],
          ].forEach(([collection, suffix]) => {
            const seen = new Set();
            states.forEach((changeState) => {
              const field = `${changeState}${suffix}Ids`;
              requireReferences(comparison[field], `${path}.${field}`, collectionIds[collection]);
              comparison[field].forEach((id, idIndex) => {
                assertShape(!seen.has(id), `${path}.${field}[${idIndex}]`, `id '${id}' appears in more than one comparison state`);
                seen.add(id);
              });
            });
          });
        });
      }

      function validateModelShape(data) {
        assertShape(isObject(data), "document", "must be an object");
        const hasSchemaVersion = hasOwn(data, "schemaVersion");
        const schemaVersion = hasSchemaVersion ? data.schemaVersion : 1;
        assertShape(!hasSchemaVersion || (Number.isInteger(schemaVersion) && (schemaVersion === 1 || schemaVersion === 2)),
          "schemaVersion", "must be absent, 1, or exact integer 2");
        const isV2 = schemaVersion === 2;
        assertShape(isObject(data.project), "project", "must be an object");
        ["sources", "categories", "nodes", "edges", "flows", "phases"].forEach((key) => {
          assertShape(Array.isArray(data[key]), key, "must be an array");
        });
        if (!isV2) return;

        ["id", "title", "summary"].forEach((key) => requireString(data.project[key], `project.${key}`, true));
        requireObjectArray(data.sources, "sources");
        data.sources.forEach((source, index) => {
          requireString(source.path, `sources[${index}].path`, true);
          requireString(source.kind, `sources[${index}].kind`, true);
        });
        const categoryIds = collectIds(data.categories, "categories");
        data.categories.forEach((category, index) => {
          const path = `categories[${index}]`;
          requireString(category.label, `${path}.label`, true);
          requireString(category.color, `${path}.color`, true);
          assertShape(/^#[0-9a-f]{6}(?:[0-9a-f]{2})?$/i.test(category.color), `${path}.color`, "must be a #RRGGBB or #RRGGBBAA value");
        });
        const phaseIds = collectIds(data.phases, "phases");
        data.phases.forEach((phase, index) => {
          requireString(phase.label, `phases[${index}].label`, true);
          requireString(phase.description, `phases[${index}].description`);
        });
        const nodeIds = collectIds(data.nodes, "nodes");
        const edgeIds = collectIds(data.edges, "edges");
        const flowIds = collectIds(data.flows, "flows");
        const snapshotIds = validateV2Snapshots(data);
        const allIds = new Set([...nodeIds, ...edgeIds, ...flowIds]);

        data.nodes.forEach((node, index) => {
          const path = `nodes[${index}]`;
          requireString(node.label, `${path}.label`, true);
          requireString(node.category, `${path}.category`, true);
          requireString(node.phase, `${path}.phase`, true);
          assertShape(categoryIds.has(node.category), `${path}.category`, "references an unknown category");
          assertShape(phaseIds.has(node.phase), `${path}.phase`, "references an unknown phase");
          requireString(node.status, `${path}.status`, true);
          assertShape(new Set(["planned", "implemented", "deprecated"]).has(node.status), `${path}.status`, "must be a recognized status");
          requireString(node.description, `${path}.description`);
          ["responsibilities", "inputs", "outputs", "sourcePaths", "evidence"].forEach((key) => requireStringArray(node[key], `${path}.${key}`));
          requireString(node.coverageGap, `${path}.coverageGap`);
          assertShape(isObject(node.position), `${path}.position`, "must be an object");
          ["x", "y"].forEach((axis) => assertShape(typeof node.position[axis] === "number" && Number.isFinite(node.position[axis]), `${path}.position.${axis}`, "must be finite"));
        });

        data.edges.forEach((edge, index) => {
          const path = `edges[${index}]`;
          requireString(edge.source, `${path}.source`, true);
          requireString(edge.target, `${path}.target`, true);
          assertShape(nodeIds.has(edge.source), `${path}.source`, "references an unknown node");
          assertShape(nodeIds.has(edge.target), `${path}.target`, "references an unknown node");
          requireString(edge.label, `${path}.label`, true);
          requireString(edge.contract, `${path}.contract`, true);
        });
        validateAnnotations(data.nodes, "nodes", nodeIds, allIds, snapshotIds, V2_NODE_KINDS);
        validateAnnotations(data.edges, "edges", edgeIds, allIds, snapshotIds, V2_EDGE_KINDS);

        data.flows.forEach((flow, index) => {
          const path = `flows[${index}]`;
          requireString(flow.label, `${path}.label`, true);
          requireString(flow.description, `${path}.description`);
          requireString(flow.actor, `${path}.actor`, true);
          requireString(flow.trigger, `${path}.trigger`, true);
          requireString(flow.outcome, `${path}.outcome`, true);
          requireReferences(flow.nodeIds, `${path}.nodeIds`, nodeIds);
          requireReferences(flow.edgeIds, `${path}.edgeIds`, edgeIds);
          requireObjectArray(flow.stages, `${path}.stages`);
          ["outputs", "safety", "evidence"].forEach((key) => requireStringArray(flow[key], `${path}.${key}`));
          requireString(flow.coverageGap, `${path}.coverageGap`);
          flow.stages.forEach((stage, stageIndex) => {
            const stagePath = `${path}.stages[${stageIndex}]`;
            requireString(stage.id, `${stagePath}.id`, true);
            requireString(stage.label, `${stagePath}.label`, true);
            requireString(stage.description, `${stagePath}.description`);
            requireReferences(stage.nodeIds, `${stagePath}.nodeIds`, nodeIds);
            stage.nodeIds.forEach((nodeId, nodeIndex) => assertShape(flow.nodeIds.includes(nodeId), `${stagePath}.nodeIds[${nodeIndex}]`, "must occur in the parent flow.nodeIds"));
            requireString(stage.backstage, `${stagePath}.backstage`);
            requireStringArray(stage.produces, `${stagePath}.produces`);
          });
          flow.edgeIds.forEach((edgeId, edgeIndex) => {
            const edge = byId(data.edges, edgeId);
            assertShape(flow.nodeIds.includes(edge.source) && flow.nodeIds.includes(edge.target), `${path}.edgeIds[${edgeIndex}]`, "edge source and target must both occur in flow.nodeIds");
          });
        });
        validateAnnotations(data.flows, "flows", flowIds, allIds, snapshotIds);

        if ("view" in data) {
          assertShape(isObject(data.view), "view", "must be an object");
          const view = data.view;
          const modes = new Set(["flow", "dependency", "combined"]);
          if ("defaultMode" in view) assertShape(typeof view.defaultMode === "string" && modes.has(view.defaultMode), "view.defaultMode", "must be a recognized mode");
          if ("defaultFlowId" in view) {
            assertShape(typeof view.defaultFlowId === "string" && view.defaultFlowId.length > 0, "view.defaultFlowId", "must be a non-empty flow ID");
            assertShape(data.flows.some((flow) => isObject(flow) && flow.id === view.defaultFlowId), "view.defaultFlowId", "must reference a known flow");
          }
          if ("availableModes" in view) {
            assertShape(Array.isArray(view.availableModes) && view.availableModes.length > 0, "view.availableModes", "must be a non-empty array");
            view.availableModes.forEach((mode, index) => {
              assertShape(typeof mode === "string" && modes.has(mode), `view.availableModes[${index}]`, "must be a recognized mode");
            });
            assertShape(new Set(view.availableModes).size === view.availableModes.length, "view.availableModes", "must not contain duplicates");
          }
          if ("layouts" in view) {
            assertShape(isObject(view.layouts), "view.layouts", "must be an object");
            ["flow", "dependency", "combined"].forEach((name) => {
              if (!(name in view.layouts)) return;
              const layout = view.layouts[name];
              assertShape(isObject(layout), `view.layouts.${name}`, "must be an object");
              if ("name" in layout) {
                const expectedName = name === "flow" ? "breadthfirst" : "preset";
                assertShape(layout.name === expectedName, `view.layouts.${name}.name`, `must be '${expectedName}'`);
              }
              if ("fit" in layout) assertShape(layout.fit === "bounded", `view.layouts.${name}.fit`, "must be 'bounded'");
              if (name === "flow" && "direction" in layout) assertShape(layout.direction === "TB", "view.layouts.flow.direction", "must be 'TB'");
            });
          }
        }
        if ("snapshots" in data) {
          assertShape(Array.isArray(data.snapshots), "snapshots", "must be an array");
          data.snapshots.forEach((snapshot, index) => {
            assertShape(isObject(snapshot), `snapshots[${index}]`, "must be an object");
            assertShape(typeof snapshot.id === "string" && snapshot.id.length > 0, `snapshots[${index}].id`, "must be a non-empty string");
            assertShape(typeof snapshot.label === "string" && snapshot.label.length > 0, `snapshots[${index}].label`, "must be a non-empty string");
          });
        }
        if ("currentSnapshotId" in data) {
          assertShape(typeof data.currentSnapshotId === "string" && data.currentSnapshotId.length > 0, "currentSnapshotId", "must be a non-empty snapshot ID");
          assertShape((data.snapshots || []).some((snapshot) => isObject(snapshot) && snapshot.id === data.currentSnapshotId), "currentSnapshotId", "must reference a known snapshot");
        }
        if ("comparisons" in data) {
          validateV2Comparisons(data, snapshotIds, {nodes: nodeIds, edges: edgeIds, flows: flowIds});
        }
      }

      function normalizeModel(data) {
        validateModelShape(data);
        const isV2 = data.schemaVersion === 2;
        const view = isV2 ? (data.view || {}) : {};
        const availableModes = isV2
          ? (view.availableModes || ["flow", "dependency"])
          : ["dependency"];
        const normalized = {
          ...data,
          isV2,
          schemaVersion: isV2 ? 2 : 1,
          nodes: data.nodes.map((node) => ({...node})),
          edges: data.edges.map((edge) => ({...edge, ...(isV2 ? {kind: edge.kind || "unknown"} : {})})),
          flows: data.flows.map((flow) => ({...flow})),
          categories: data.categories.map((category) => ({...category})),
          phases: data.phases.map((phase) => ({...phase})),
          view: {
            defaultMode: isV2 ? (view.defaultMode || "dependency") : "dependency",
            defaultFlowId: view.defaultFlowId || "",
            availableModes: [...availableModes],
            layouts: {
              flow: {name: "breadthfirst", direction: "TB", fit: "bounded", ...(view.layouts?.flow || {})},
              dependency: {name: "preset", fit: "bounded", ...(view.layouts?.dependency || {})},
              combined: {name: "preset", fit: "bounded", ...(view.layouts?.combined || {})},
            },
          },
          snapshots: isV2 ? (data.snapshots || []).map((snapshot) => ({...snapshot})) : [],
          comparisons: isV2 ? (data.comparisons || []).map((comparison) => ({...comparison})) : [],
        };
        if (isV2 && !normalized.view.availableModes.includes(normalized.view.defaultMode)) {
          normalized.view.defaultMode = normalized.view.availableModes[0] || "dependency";
        }
        if (isV2 && normalized.view.defaultMode === "flow" && normalized.flows.length === 0) {
          normalized.view.defaultMode = "dependency";
        }
        return normalized;
      }

      function initializeState() {
        const params = new URLSearchParams(location.hash.slice(1));
        const availableModes = model.view.availableModes;
        let mode = model.isV2 ? model.view.defaultMode : "dependency";
        if (model.isV2 && !availableModes.includes(mode)) mode = availableModes[0] || "dependency";
        if (model.isV2 && mode === "flow" && model.flows.length === 0) mode = "dependency";
        const requestedMode = params.get("mode");
        if (model.isV2 && requestedMode && availableModes.includes(requestedMode) && !(requestedMode === "flow" && model.flows.length === 0)) {
          mode = requestedMode;
        }
        let flowId = "all";
        const requestedFlow = params.get("flow");
        if (model.flows.length > 0 && requestedFlow === "all") {
          flowId = "all";
        } else if (model.flows.length > 0 && requestedFlow && byId(model.flows, requestedFlow)) {
          flowId = requestedFlow;
        } else if (model.isV2 && mode === "flow" && model.flows.length > 0 && model.view.defaultFlowId && byId(model.flows, model.view.defaultFlowId)) {
          flowId = model.view.defaultFlowId;
        } else if (model.isV2 && mode === "flow" && model.flows.length > 0) {
          flowId = model.flows[0].id;
        }
        state = {
          ...state,
          mode,
          flowId,
          selectedNode: "",
          snapshotId: "current",
          comparisonId: "current",
          searchQuery: "",
          comparisonNotice: "",
        };
      }

      function safeCategoryColor(category) {
        const color = typeof category?.color === "string" ? category.color : "";
        return /^#[0-9a-f]{6}(?:[0-9a-f]{2})?$/i.test(color) ? color : "#626878";
      }

      function activeComparisonChange(collection, id) {
        const active = model?.comparisons.find((item) => item.id === state.comparisonId);
        if (!active) return "";
        const suffix = COMPARISON_SUFFIX[collection];
        for (const change of CHANGE_ORDER) {
          if ((active[`${change}${suffix}Ids`] || []).includes(id)) return change;
        }
        return "";
      }

      function comparisonState(model, collection, id) {
        const active = model.comparisons.find((item) => item.id === state.comparisonId);
        if (active) {
          for (const change of ["existing", "inherited", "changed", "added", "replaced", "removed"]) {
            if ((active[`${change}${COMPARISON_SUFFIX[collection]}Ids`] || []).includes(id)) return change;
          }
        }
        const item = byId(model[collection], id);
        return item?.changeType || "existing";
      }

      function hasChangeAnnotation(collection, item) {
        return Boolean(model?.isV2 && item && (hasOwn(item, "changeType") || activeComparisonChange(collection, item.id)));
      }

      function displayChange(collection, item) {
        return hasChangeAnnotation(collection, item) ? comparisonState(model, collection, item.id) : "";
      }

      function snapshotCoverageUnknown(item) {
        return Boolean(model?.isV2 && state.snapshotId !== "current" && item && !hasOwn(item, "snapshotIds"));
      }

      function snapshotCoverageSuffix(collection, item) {
        return collection !== "nodes" && snapshotCoverageUnknown(item) ? " [snapshot coverage unknown]" : "";
      }

      function displayLabel(collection, item) {
        const change = displayChange(collection, item);
        const label = change
          ? `${(CHANGE_STYLES[change] || CHANGE_STYLES.existing).glyph} ${item.label} [${change}]`
          : item.label;
        return `${label}${snapshotCoverageSuffix(collection, item)}`;
      }

      function nodeStyleState(node) {
        const category = byId(model.categories, node.category);
        const status = STATUS_STYLES[node.status] || STATUS_STYLES.implemented;
        const change = comparisonState(model, "nodes", node.id);
        const annotated = hasChangeAnnotation("nodes", node);
        const changeStyle = CHANGE_STYLES[change] || CHANGE_STYLES.existing;
        const borderStyle = annotated ? changeStyle.borderStyle : status.borderStyle;
        const borderWidth = annotated ? changeStyle.borderWidth : status.borderWidth;
        return {
          shape: NODE_KIND_SHAPES[node.kind] || NODE_KIND_SHAPES.service,
          borderStyle,
          borderWidth,
          statusBorderStyle: status.borderStyle,
          statusBorderWidth: status.borderWidth,
          changeBorderStyle: annotated ? changeStyle.borderStyle : "",
          changeBorderWidth: annotated ? changeStyle.borderWidth : 0,
          status: node.status || "implemented",
          changeType: change,
          changeBadge: annotated,
          glyph: annotated ? changeStyle.glyph : "",
          displayLabel: displayLabel("nodes", node),
          ariaLabel: `${node.label}, status ${node.status || "implemented"}, kind ${node.kind || "service"}${annotated ? `, change ${change}` : ""}`,
          categoryColor: safeCategoryColor(category),
          borderColor: state.selectedNode === node.id ? "#f0bd45" : safeCategoryColor(category),
          selected: state.selectedNode === node.id,
          opacity: status.opacity,
        };
      }

      function edgeStyleState(edge) {
        const kind = model.isV2 ? (edge.kind || "unknown") : edge.kind;
        const kindStyle = EDGE_KIND_STYLES[kind] || {lineStyle: "solid", arrow: "triangle", width: 1};
        const change = comparisonState(model, "edges", edge.id);
        const annotated = hasChangeAnnotation("edges", edge);
        const changeStyle = CHANGE_EDGE_STYLES[change] || CHANGE_EDGE_STYLES.existing;
        // An explicit diff line treatment wins; kind arrows and the wider kind/diff width remain authoritative.
        const lineStyle = annotated ? changeStyle.lineStyle : kindStyle.lineStyle;
        return {
          lineStyle,
          kindLineStyle: kindStyle.lineStyle,
          changeLineStyle: annotated ? changeStyle.lineStyle : "",
          arrow: kindStyle.arrow,
          width: Math.max(kindStyle.width, annotated ? changeStyle.width : 0),
          kind: kind || "unknown",
          changeType: change,
          changeBadge: annotated,
          glyph: annotated ? (CHANGE_STYLES[change] || CHANGE_STYLES.existing).glyph : "",
          displayLabel: displayLabel("edges", edge),
          ariaLabel: `${edge.label}, ${edge.source} to ${edge.target}${annotated ? `, change ${change}` : ""}${snapshotCoverageUnknown(edge) ? ", snapshot coverage unknown" : ""}`,
        };
      }

      function searchableNode(node) {
        return JSON.stringify({
          label: node.label,
          description: node.description,
          responsibilities: node.responsibilities,
          inputs: node.inputs,
          outputs: node.outputs,
          sourcePaths: node.sourcePaths,
          evidence: node.evidence,
          coverageGap: node.coverageGap,
        }).toLowerCase();
      }

      function snapshotMatches(item) {
        if (!model.isV2 || state.snapshotId === "current" || !item || !hasOwn(item, "snapshotIds")) return true;
        return item.snapshotIds.includes(state.snapshotId);
      }

      function changeMatches(collection, item) {
        return state.changeFilter === "all" || comparisonState(model, collection, item.id) === state.changeFilter;
      }

      function changesOnlyMatches(collection, item) {
        return !state.showChangesOnly || hasChangeAnnotation(collection, item);
      }

      function applyFilters(model, state) {
        const query = state.searchQuery.trim().toLowerCase();
        const nodes = model.nodes.filter((node) => {
          if (state.statusFilter !== "all" && node.status !== state.statusFilter) return false;
          if (state.categoryFilter !== "all" && node.category !== state.categoryFilter && node.kind !== state.categoryFilter) return false;
          if (!changeMatches("nodes", node) || !changesOnlyMatches("nodes", node)) return false;
          if (!state.showDeprecated && node.status === "deprecated") return false;
          if (!snapshotMatches(node)) return false;
          return !query || searchableNode(node).includes(query);
        });
        const nodeSet = new Set(nodes.map((node) => node.id));
        const edges = model.edges.filter((edge) => nodeSet.has(edge.source) && nodeSet.has(edge.target)
          && snapshotMatches(edge) && changeMatches("edges", edge) && changesOnlyMatches("edges", edge));
        const flows = model.flows.filter((flow) => snapshotMatches(flow)
          && changeMatches("flows", flow) && changesOnlyMatches("flows", flow));
        return {nodes, edges, flows};
      }

      function renderLegend() {
        const categories = model.categories.map((category) =>
          `<span class="legend-entry category"><i style="--color:${safeCategoryColor(category)}" aria-hidden="true"></i>${escapeHtml(category.label)} category</span>`
        );
        const lifecycle = [
          ["planned", "dashed 2px border"],
          ["implemented", "solid 1px border"],
          ["deprecated", "dotted 2px border; dimmed"],
        ].map(([status, explanation]) =>
          `<span class="legend-entry pattern"><i aria-hidden="true">${status === "planned" ? "··" : status === "implemented" ? "—" : "⋯"}</i>${status}: ${explanation}</span>`
        );
        const changes = model.isV2 ? CHANGE_ORDER.map((change) => {
          const style = CHANGE_STYLES[change];
          return `<span class="legend-entry pattern"><i aria-hidden="true">${escapeHtml(style.glyph)}</i>${escapeHtml(change)}: ${escapeHtml(style.borderStyle)} ${style.borderWidth}px / ${escapeHtml(CHANGE_EDGE_STYLES[change].lineStyle)} edge</span>`;
        }) : [];
        $("#legend").innerHTML = [...categories, ...lifecycle, ...changes].join("");
      }

      function renderModeControls() {
        const controls = $("#modeControls");
        if (!model.isV2) {
          controls.hidden = true;
          controls.innerHTML = "";
          return;
        }
        controls.hidden = false;
        const labels = {flow: "Flow", dependency: "Dependency", combined: "Combined"};
        controls.innerHTML = model.view.availableModes.map((mode) =>
          `<button class="mode-button" type="button" data-mode="${escapeHtml(mode)}" aria-pressed="${mode === state.mode}">${escapeHtml(labels[mode] || mode)}</button>`
        ).join("");
      }

      function renderFilterControls() {
        const controls = $("#filterControls");
        const categorySelect = $("#categoryFilter");
        if (!model.isV2) {
          controls.hidden = true;
          categorySelect.innerHTML = "<option value=\"all\">All categories</option>";
          return;
        }
        controls.hidden = false;
        const categoryOptions = [...new Map([
          ...model.categories.map((category) => [category.id, category.label]),
          ...model.nodes.filter((node) => node.kind).map((node) => [node.kind, node.kind]),
        ]).entries()];
        categorySelect.innerHTML = `<option value="all">All categories</option>${categoryOptions.map(([id, label]) =>
          `<option value="${escapeHtml(id)}">${escapeHtml(label)}</option>`
        ).join("")}`;
        const currentId = model.currentSnapshotId || "current";
        const currentLabel = model.currentSnapshotId ? `Current (${model.currentSnapshotId})` : "Current";
        $("#snapshotSelect").innerHTML = `<option value="${escapeHtml(currentId)}">${escapeHtml(currentLabel)}</option>${model.snapshots
          .filter((snapshot) => snapshot.id !== model.currentSnapshotId)
          .map((snapshot) => `<option value="${escapeHtml(snapshot.id)}">${escapeHtml(snapshot.label)}</option>`).join("")}`;
        $("#comparisonSelect").innerHTML = `<option value="current">Current</option>${model.comparisons.map((comparison) => {
          const from = byId(model.snapshots, comparison.fromSnapshotId);
          const to = byId(model.snapshots, comparison.toSnapshotId);
          return `<option value="${escapeHtml(comparison.id)}">${escapeHtml(comparison.label || `${from?.label || comparison.fromSnapshotId} → ${to?.label || comparison.toSnapshotId}`)}</option>`;
        }).join("")}`;
        $("#statusFilter").value = state.statusFilter;
        categorySelect.value = state.categoryFilter;
        $("#changeFilter").value = state.changeFilter;
        $("#showLabelsToggle").checked = state.showLabels;
        $("#showDeprecatedToggle").checked = state.showDeprecated;
        $("#showChangesOnlyToggle").checked = state.showChangesOnly;
        $("#snapshotSelect").value = state.snapshotId === "current" ? currentId : state.snapshotId;
        $("#comparisonSelect").value = state.comparisonId;
      }

      function renderNodeInventory() {
        if (!model) return;
        const inventory = $("#nodeInventory");
        const nodes = applyFilters(model, state).nodes;
        const entries = nodes.map((node) => {
          const change = displayChange("nodes", node);
          const kind = node.kind || "service";
          const coverage = model.isV2 && state.snapshotId !== "current" && !hasOwn(node, "snapshotIds")
            ? " · snapshot coverage unknown" : "";
          const label = displayLabel("nodes", node);
          const changeText = change || "unannotated";
          const accessible = `${node.label}, status ${node.status || "implemented"}, kind ${kind}, change ${changeText}${coverage}`;
          return `<button class="inventory-item" type="button" data-node-id="${escapeHtml(node.id)}" data-change-type="${escapeHtml(change || "existing")}" aria-current="${state.selectedNode === node.id}" aria-label="${escapeHtml(accessible)}"><strong>${escapeHtml(label)}</strong><span>Status: ${escapeHtml(node.status || "implemented")} · Kind: ${escapeHtml(kind)} · Change: ${escapeHtml(changeText)}${coverage ? `<span class="coverage-unknown">${escapeHtml(coverage)}</span>` : ""}</span></button>`;
        }).join("");
        inventory.innerHTML = `<p class="section-label">Node inventory</p><div class="inventory-list">${entries || "<p class=\"inventory-empty\">No nodes match the current filters.</p>"}</div>`;
      }

      function renderFlowNav() {
        const allLabel = model.isV2 ? "All flows" : "All relationships";
        const visibleFlows = model.isV2 ? applyFilters(model, state).flows : model.flows;
        const views = [
          { id: "all", label: allLabel, description: model.isV2 ? `${model.flows.length} flows across ${model.nodes.length} modules` : `${model.nodes.length} modules and ${model.edges.length} relationships` },
          ...visibleFlows
        ];
        $("#flowViews").innerHTML = `<p class="section-label">Flow views</p><div class="flow-grid">${
          views.map((flow) => {
            const label = flow.id === "all" ? flow.label : displayLabel("flows", flow);
            const description = `${flow.description}${flow.id !== "all" && snapshotCoverageUnknown(flow) ? " · snapshot coverage unknown" : ""}`;
            return `<button class="flow-button" type="button" data-flow-id="${escapeHtml(flow.id)}" aria-pressed="${flow.id === state.flowId}"><strong>${escapeHtml(label)}</strong><span>${escapeHtml(description)}</span></button>`;
          }).join("")
        }</div>`;
      }

      function setDetail(kicker, title, chips, body) {
        $("#detailKicker").textContent = kicker;
        $("#detailTitle").textContent = title;
        $("#detailChips").innerHTML = chips.map((chip) => `<span class="chip">${escapeHtml(chip)}</span>`).join("");
        $("#detailBody").innerHTML = body;
      }

      function detailNotice() {
        return state.comparisonNotice ? `<p class="comparison-notice">${escapeHtml(state.comparisonNotice)}</p>` : "";
      }

      function renderOverview() {
        setDetail("Project index", model.isV2 ? "All flows" : "All relationships",
          [`${model.flows.length} flows`, `${model.nodes.length} modules`],
          detailNotice() + `<p class="description">${escapeHtml(model.project.summary)}</p>` +
          list("Sources", model.sources.map((source) => `${source.kind}: ${source.path}`)) +
          list("How to explore", ["Select a Flow above to focus a delivery path.", "Select a graph node to inspect its responsibilities and evidence."])
        );
      }

      function renderFlow(flow) {
        if (!flow) return renderOverview();
        const stages = (flow.stages || []).map((stage, index) =>
          `<article class="stage"><strong>${String(index + 1).padStart(2, "0")} · ${escapeHtml(stage.label)}</strong><p>${escapeHtml(stage.description)}</p><p><b>Backstage:</b> ${escapeHtml(stage.backstage)}</p><p><b>Produces:</b> ${escapeHtml((stage.produces || []).join(", "))}</p></article>`
        ).join("");
        const change = displayChange("flows", flow);
        const coverage = snapshotCoverageUnknown(flow);
        setDetail("Flow / service blueprint", displayLabel("flows", flow),
          [`${flow.stages?.length || 0} stages`, `${flow.nodeIds?.length || 0} modules`, ...(change ? [`change: ${change}`] : [])],
          detailNotice() + (coverage ? `<p class="coverage-unknown">snapshot coverage unknown</p>` : "") + `<p class="description">${escapeHtml(flow.description)}</p>` +
          list("Contract", [`Actor: ${flow.actor}`, `Trigger: ${flow.trigger}`, `Outcome: ${flow.outcome}`]) +
          `<section class="detail-section"><h3>Journey stages</h3>${stages}</section>` +
          list("Outputs", flow.outputs) + list("Safety & recovery", flow.safety) +
          list("Evidence", flow.evidence) + list("Coverage gap", flow.coverageGap ? [flow.coverageGap] : [])
        );
      }

      function renderComparison(comparison) {
        const from = byId(model.snapshots, comparison.fromSnapshotId);
        const to = byId(model.snapshots, comparison.toSnapshotId);
        const counts = [];
        for (const change of CHANGE_ORDER) {
          const nodeCount = (comparison[`${change}NodeIds`] || []).length;
          const edgeCount = (comparison[`${change}EdgeIds`] || []).length;
          const flowCount = (comparison[`${change}FlowIds`] || []).length;
          counts.push(`${change}: ${nodeCount} nodes · ${edgeCount} edges · ${flowCount} flows`);
        }
        const replacements = [
          ...model.nodes.map((item) => ({collection: "node", item})),
          ...model.edges.map((item) => ({collection: "edge", item})),
          ...model.flows.map((item) => ({collection: "flow", item})),
        ].filter(({item}) => item.replacesId)
          .map(({item}) => `${item.id} replaces ${item.replacesId}`);
        setDetail("Snapshot comparison", `${from?.label || comparison.fromSnapshotId} → ${to?.label || comparison.toSnapshotId}`,
          [`${from?.label || comparison.fromSnapshotId} → ${to?.label || comparison.toSnapshotId}`, `${model.nodes.length} nodes`, `${model.edges.length} edges`],
          `<p class="comparison-notice">From ${escapeHtml(from?.label || comparison.fromSnapshotId)} → ${escapeHtml(to?.label || comparison.toSnapshotId)}</p>` +
          list("Change counts", counts) + list("Replacement links", replacements) +
          list("Summary", comparison.summary ? [comparison.summary] : [])
        );
      }

      function renderNode(node) {
        const category = byId(model.categories, node.category);
        const visibleEdges = applyFilters(model, state).edges;
        const relations = visibleEdges.filter((edge) => edge.source === node.id || edge.target === node.id)
          .map((edge) => {
            const otherId = edge.source === node.id ? edge.target : edge.source;
            const other = byId(model.nodes, otherId);
            const edgeLabel = displayLabel("edges", edge);
            return `<button class="relation" type="button" data-node-id="${escapeHtml(otherId)}" aria-label="Inspect ${escapeHtml(other?.label || otherId)} via ${escapeHtml(edgeLabel)}"><span>${escapeHtml(other?.label || otherId)}</span><small>${escapeHtml(edgeLabel)}</small></button>`;
          }).join("");
        const change = displayChange("nodes", node);
        setDetail("Node inspector", displayLabel("nodes", node),
          [category?.label || node.category, `status: ${node.status}`, `kind: ${node.kind || "service"}`, node.phase, ...(change ? [`change: ${change}`] : [])],
          detailNotice() + `<p class="description">${escapeHtml(node.description)}</p>` +
          list("Responsibilities", node.responsibilities) + list("Inputs", node.inputs) +
          list("Outputs", node.outputs) + list("Source paths", node.sourcePaths) +
          list("Evidence", node.evidence) + list("Coverage gap", node.coverageGap ? [node.coverageGap] : []) +
          `<section class="detail-section"><h3>Direct relationships</h3>${relations || "<p class='description'>No direct relationships.</p>"}</section>`
        );
      }

      function renderCurrentDetail() {
        if (state.selectedNode && byId(model.nodes, state.selectedNode)) {
          renderNode(byId(model.nodes, state.selectedNode));
        } else if (state.comparisonId !== "current") {
          renderComparison(byId(model.comparisons, state.comparisonId));
        } else if (state.flowId !== "all" && (state.mode !== "dependency" || !model.isV2)) {
          renderFlow(byId(model.flows, state.flowId));
        } else {
          renderOverview();
        }
      }

      function idsForFlow(model, flowId) {
        if (flowId === "all") {
          return {
            nodeIds: [...new Set(model.flows.flatMap((flow) => flow.nodeIds || []))],
            edgeIds: [...new Set(model.flows.flatMap((flow) => flow.edgeIds || []))],
          };
        }
        const flow = byId(model.flows, flowId);
        return {nodeIds: [...(flow?.nodeIds || [])], edgeIds: [...(flow?.edgeIds || [])]};
      }

      function graphElementsForState(model, state) {
        const all = {nodeIds: model.nodes.map((node) => node.id), edgeIds: model.edges.map((edge) => edge.id)};
        const selected = state.mode === "flow" ? idsForFlow(model, state.flowId) : all;
        const filtered = applyFilters(model, state);
        const nodes = filtered.nodes.filter((node) => selected.nodeIds.includes(node.id));
        const nodeSet = new Set(nodes.map((node) => node.id));
        const edges = filtered.edges.filter((edge) => selected.edgeIds.includes(edge.id)
          && nodeSet.has(edge.source) && nodeSet.has(edge.target));
        return {nodes, edges};
      }

      function layoutForMode(model, state, elementCount) {
        if (state.mode === "flow" && model.isV2) {
          return {
            name: "breadthfirst",
            fit: false,
            directed: true,
            circle: false,
            spacingFactor: 1.2,
            avoidOverlap: true,
            nodeDimensionsIncludeLabels: true,
            animate: !reducedMotion,
          };
        }
        return {name: "preset", fit: false, animate: false};
      }

      function orientFlowLayers(flowNodeIds, flowEdgeIds) {
        const nodeSet = new Set(flowNodeIds);
        const inDegree = new Map(flowNodeIds.map((id) => [id, 0]));
        model.edges.filter((edge) => flowEdgeIds.includes(edge.id)
          && nodeSet.has(edge.source) && nodeSet.has(edge.target)).forEach((edge) => {
            inDegree.set(edge.target, (inDegree.get(edge.target) || 0) + 1);
          });
        const roots = flowNodeIds.filter((id) => inDegree.get(id) === 0);
        const downstream = flowNodeIds.filter((id) => !roots.includes(id));
        const meanY = (ids) => {
          const values = ids.map((id) => cy.getElementById(id).position("y")).filter(Number.isFinite);
          return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : undefined;
        };
        let rootsY = meanY(roots);
        let downstreamY = meanY(downstream);
        if (Number.isFinite(rootsY) && Number.isFinite(downstreamY) && rootsY > downstreamY) {
          const maxY = Math.max(...flowNodeIds.map((id) => cy.getElementById(id).position("y")));
          flowNodeIds.forEach((id) => {
            const element = cy.getElementById(id);
            const position = element.position();
            element.position({x: position.x, y: maxY - position.y});
          });
          rootsY = meanY(roots);
          downstreamY = meanY(downstream);
        }
        rootMeanY = rootsY;
        downstreamMeanY = downstreamY;
        return {rootsY, downstreamY};
      }

      function selectedFlowIds() {
        return idsForFlow(model, state.flowId);
      }

      function selectedFlowRecord() {
        if (state.flowId !== "all") return byId(model.flows, state.flowId);
        const ids = selectedFlowIds();
        return {id: "all", label: model.isV2 ? "All flows" : "All relationships", nodeIds: ids.nodeIds, edgeIds: ids.edgeIds};
      }

      function updateTelemetry(elements, largeFlow) {
        const nodeIds = elements.nodes.map((node) => node.id);
        const edgeIds = elements.edges.map((edge) => edge.id);
        $("#cy").dataset.visibleNodeIds = JSON.stringify(nodeIds);
        $("#cy").dataset.visibleEdgeIds = JSON.stringify(edgeIds);
        $("#cy").dataset.layoutMode = state.mode;
        $("#cy").dataset.largeFlow = String(largeFlow);
        $("#cy").dataset.labels = state.showLabels ? "visible" : "hidden";
        $("#largeFlowHint").textContent = largeFlow ? "Large flow — pan or zoom to explore" : "";
      }

      function applyFlowClasses() {
        cy.elements().removeClass("dimmed flow");
        const selected = selectedFlowIds();
        if (!model.isV2 && state.flowId !== "all") {
          cy.elements().addClass("dimmed");
        }
        if (state.mode === "flow" && model.isV2) {
          cy.nodes().addClass("flow");
          cy.edges().addClass("flow");
        } else if ((state.mode === "combined" && model.isV2) || (!model.isV2 && state.flowId !== "all")) {
          selected.nodeIds.forEach((id) => cy.getElementById(id).removeClass("dimmed").addClass("flow"));
          selected.edgeIds.forEach((id) => cy.getElementById(id).removeClass("dimmed").addClass("flow"));
        }
      }

      function applyElementStyles() {
        if (!cy) return;
        cy.nodes().forEach((element) => {
          const node = byId(model.nodes, element.id());
          if (!node) return;
          const style = nodeStyleState(node);
          const selected = element.selected();
          element.data({
            label: style.displayLabel,
            displayLabel: style.displayLabel,
            ariaLabel: style.ariaLabel,
            changeType: style.changeType,
          });
          element.style({
            shape: style.shape,
            label: state.showLabels ? style.displayLabel : "",
            "border-style": style.borderStyle,
            "border-width": style.borderWidth,
            "border-color": selected ? "#f0bd45" : style.categoryColor,
            "background-color": selected ? "#292313" : (element.hasClass("flow") ? "#1d1f27" : "#171922"),
            color: selected ? "#fff1c5" : "#e5e6eb",
            opacity: element.hasClass("dimmed") ? .07 : style.opacity,
          });
        });
        cy.edges().forEach((element) => {
          const edge = byId(model.edges, element.id());
          if (!edge) return;
          const style = edgeStyleState(edge);
          element.data({
            label: style.displayLabel,
            displayLabel: style.displayLabel,
            ariaLabel: style.ariaLabel,
            changeType: style.changeType,
          });
          element.style({
            "line-style": style.lineStyle,
            width: style.width + (element.hasClass("flow") && !style.changeBadge ? 1 : 0),
            "target-arrow-shape": style.arrow,
            "line-color": element.hasClass("flow") ? "#d6aa3f" : "#3b3f4b",
            "target-arrow-color": element.hasClass("flow") ? "#f0bd45" : "#585e6e",
            label: state.showLabels ? style.displayLabel : "",
            color: element.hasClass("flow") ? "#d6aa3f" : "#747987",
            opacity: element.hasClass("dimmed") ? .07 : 1,
          });
        });
      }

      function styleTelemetry() {
        const edges = Object.fromEntries(model.edges.map((edge) => {
          const style = edgeStyleState(edge);
          const element = cy?.getElementById(edge.id);
          if (!element?.nonempty()) return [edge.id, {
            ...style,
            renderedLineStyle: style.lineStyle,
            renderedArrow: style.arrow,
            renderedWidth: style.width,
            renderedOpacity: null,
            renderedAvailable: false,
            rendered: null,
          }];
          const renderedWidth = Number.parseFloat(element.style("width"));
          const rendered = {
            lineStyle: element.style("line-style") || style.lineStyle,
            arrow: element.style("target-arrow-shape") || style.arrow,
            width: Number.isFinite(renderedWidth) ? renderedWidth : style.width,
            opacity: Number.parseFloat(element.style("opacity")),
          };
          return [edge.id, {
            ...style,
            lineStyle: rendered.lineStyle,
            arrow: rendered.arrow,
            renderedLineStyle: rendered.lineStyle,
            renderedArrow: rendered.arrow,
            renderedWidth: rendered.width,
            renderedOpacity: rendered.opacity,
            renderedAvailable: true,
            rendered,
          }];
        }));
        return {
          nodes: Object.fromEntries(model.nodes.map((node) => [node.id, {...nodeStyleState(node)}])),
          edges,
        };
      }

      function fitGraph(target, automatic = false) {
        if (!cy) return;
        fitCalls += 1;
        if (!automatic) fitCallsAfterSelection += 1;
        lastFitPadding = model?.isV2 ? (innerWidth <= 900 ? 38 : 76) : 90;
        cy.fit(target.nonempty() ? target : cy.elements(), lastFitPadding);
      }

      function focusCurrent(automatic = false) {
        if (!cy) return;
        const target = !model.isV2 && state.flowId !== "all" ? cy.nodes(".flow") : cy.elements();
        fitGraph(target, automatic);
      }

      function refreshFilteredView() {
        const filtered = applyFilters(model, state);
        const flowWasHidden = model.isV2 && state.flowId !== "all"
          && !filtered.flows.some((flow) => flow.id === state.flowId);
        if (flowWasHidden) {
          state.flowId = "all";
          history.replaceState(null, "", `#mode=${encodeURIComponent(state.mode)}&flow=all`);
        }
        if (state.selectedNode && !filtered.nodes.some((node) => node.id === state.selectedNode)) {
          state.selectedNode = "";
          cy?.$(':selected').unselect();
        }
        renderFlowNav();
        refreshGraph();
        renderNodeInventory();
        renderCurrentDetail();
      }

      function refreshGraph() {
        if (!cy) return;
        const generation = ++layoutGeneration;
        activeLayout?.stop();
        const elements = graphElementsForState(model, state);
        const cytoscapeElements = [
          ...elements.nodes.map((node) => ({group: "nodes", data: {...node, label: displayLabel("nodes", node)}, position: {...node.position}})),
          ...elements.edges.map((edge) => ({group: "edges", data: {...edge, label: displayLabel("edges", edge)}})),
        ];
        cy.elements().remove();
        cy.add(cytoscapeElements);
        const visibleNodeIds = new Set(elements.nodes.map((node) => node.id));
        if (state.selectedNode && !visibleNodeIds.has(state.selectedNode)) {
          state.selectedNode = "";
          cy.$(":selected").unselect();
        }
        applyFlowClasses();
        if (state.selectedNode && cy.getElementById(state.selectedNode).nonempty()) cy.getElementById(state.selectedNode).select();
        applyElementStyles();
        renderNodeInventory();
        const largeFlow = model.isV2 && state.mode === "flow" && elements.nodes.length > 40;
        updateTelemetry(elements, largeFlow);
        layoutOptions = layoutForMode(model, state, elements.nodes.length);
        const layout = cy.layout({...layoutOptions});
        activeLayout = layout;
        let completed = false;
        const afterLayout = () => {
          if (completed || generation !== layoutGeneration) return;
          completed = true;
          if (state.mode === "flow" && model.isV2) {
            const flowIds = selectedFlowIds();
            orientFlowLayers(flowIds.nodeIds, flowIds.edgeIds);
          } else {
            rootMeanY = undefined;
            downstreamMeanY = undefined;
          }
          applyElementStyles();
          updateTelemetry(elements, largeFlow);
          if (largeFlow) {
            cy.zoom(Math.max(cy.zoom(), 0.35));
          } else if (model.isV2 && state.mode === "flow") {
            focusCurrent(true);
          } else if (!model.isV2) {
            focusCurrent(true);
          }
        };
        layout.one("layoutstop", afterLayout);
        layout.run();
      }

      function chooseMode(mode) {
        if (!model?.isV2 || !model.view.availableModes.includes(mode)) return;
        if (mode === "flow" && model.flows.length === 0) mode = "dependency";
        if (mode === "flow" && state.flowId === "all" && model.flows.length > 0) {
          state.flowId = (model.view.defaultFlowId && byId(model.flows, model.view.defaultFlowId))
            ? model.view.defaultFlowId
            : model.flows[0].id;
        }
        state.mode = mode;
        state.selectedNode = "";
        state.comparisonNotice = "";
        fitCallsAfterSelection = 0;
        cy?.$(":selected").unselect();
        renderModeControls();
        renderFilterControls();
        renderFlowNav();
        renderCurrentDetail();
        refreshGraph();
        history.replaceState(null, "", `#mode=${encodeURIComponent(state.mode)}&flow=${encodeURIComponent(state.flowId)}`);
      }

      function chooseFlow(flowId, scroll = true) {
        if (!model || (flowId !== "all" && !byId(model.flows, flowId))) return;
        state.flowId = flowId;
        state.selectedNode = "";
        state.comparisonNotice = "";
        fitCallsAfterSelection = 0;
        cy?.$(":selected").unselect();
        renderFlowNav();
        renderCurrentDetail();
        refreshGraph();
        history.replaceState(null, "", `#mode=${encodeURIComponent(state.mode)}&flow=${encodeURIComponent(flowId)}`);
        if (scroll && flowId !== "all") {
          const behavior = reducedMotion ? "auto" : "smooth";
          lastScrollBehavior = behavior;
          $("#contentAnchor").scrollIntoView({behavior});
        }
      }

      function chooseNode(nodeId) {
        const node = byId(model.nodes, nodeId);
        if (!node) return;
        state.selectedNode = nodeId;
        const element = cy?.getElementById(nodeId);
        if (element?.nonempty()) {
          cy.$(":selected").unselect();
          element.select();
        }
        renderNode(node);
        renderNodeInventory();
        history.replaceState(null, "", `#mode=${encodeURIComponent(state.mode)}&flow=${encodeURIComponent(state.flowId)}&node=${encodeURIComponent(nodeId)}`);
        const behavior = reducedMotion ? "auto" : "smooth";
        lastScrollBehavior = behavior;
        $("#contentAnchor").scrollIntoView({behavior});
      }

      function chooseSnapshot(snapshotId) {
        if (!model?.isV2) return;
        const currentId = model.currentSnapshotId || "current";
        const known = snapshotId === "current" || snapshotId === currentId || Boolean(byId(model.snapshots, snapshotId));
        if (!known) {
          state.snapshotId = "current";
          state.comparisonNotice = `Snapshot ${snapshotId} is unavailable; showing Current.`;
        } else {
          state.snapshotId = snapshotId === currentId ? "current" : snapshotId;
          state.comparisonNotice = "";
        }
        $("#snapshotSelect").value = state.snapshotId === "current" ? currentId : state.snapshotId;
        refreshFilteredView();
      }

      function chooseComparison(comparisonId) {
        if (!model?.isV2) return;
        const known = comparisonId === "current" || Boolean(byId(model.comparisons, comparisonId));
        if (!known) {
          state.comparisonId = "current";
          state.comparisonNotice = `Comparison ${comparisonId} is unavailable; showing Current.`;
        } else {
          state.comparisonId = comparisonId;
          state.comparisonNotice = "";
        }
        state.selectedNode = "";
        cy?.$(':selected').unselect();
        $("#comparisonSelect").value = state.comparisonId;
        renderFilterControls();
        refreshFilteredView();
      }

      function initializeGraph() {
        if (typeof cytoscape !== "function") throw new Error("Cytoscape.js is unavailable");
        cy = cytoscape({
          container: $("#cy"),
          elements: [],
          layout: {name: "preset", fit: false},
          minZoom: .12,
          maxZoom: 2.5,
          boxSelectionEnabled: false,
          style: [
            {selector: "node", style: {shape:"roundrectangle", width:120, height:34, padding:"10px", "background-color":"#171922", "border-width":1, "border-style":"solid", label:"data(label)", color:"#e5e6eb", "font-size":11, "text-wrap":"wrap", "text-max-width":150, "text-valign":"center", "text-halign":"center"}},
            {selector: "edge", style: {"curve-style":"bezier", width:1, "line-color":"#3b3f4b", "target-arrow-color":"#585e6e", "target-arrow-shape":"triangle", "arrow-scale":.72, label:"data(label)", color:"#747987", "font-size":8, "text-background-color":"#090a0f", "text-background-opacity":.82, "text-background-padding":3, "text-rotation":"autorotate"}},
            {selector: ".dimmed", style: {opacity:.07}},
            {selector: "node.flow", style: {opacity:1, "background-color":"#1d1f27"}},
            {selector: "edge.flow", style: {opacity:1}},
            {selector: "node:selected", style: {"border-width":3, "border-color":"#f0bd45", "background-color":"#292313", color:"#fff1c5"}}
          ]
        });
        cy.on("tap", "node", (event) => chooseNode(event.target.id()));
        cy.on("select unselect", "node", () => applyElementStyles());
        refreshGraph();
      }

      $("#modeControls").addEventListener("click", (event) => {
        const button = event.target.closest("[data-mode]");
        if (button) chooseMode(button.dataset.mode);
      });
      $("#flowNav").addEventListener("click", (event) => {
        const button = event.target.closest("[data-flow-id]");
        if (button) chooseFlow(button.dataset.flowId);
      });
      $("#detailBody").addEventListener("click", (event) => {
        const button = event.target.closest("[data-node-id]");
        if (button) chooseNode(button.dataset.nodeId);
      });
      $("#filterControls").addEventListener("change", (event) => {
        const control = event.target;
        if (!model || !control) return;
        if (control.id === "snapshotSelect") return chooseSnapshot(control.value);
        if (control.id === "comparisonSelect") return chooseComparison(control.value);
        if (control.id === "statusFilter") state.statusFilter = control.value;
        if (control.id === "categoryFilter") state.categoryFilter = control.value;
        if (control.id === "changeFilter") state.changeFilter = control.value;
        if (control.id === "showLabelsToggle") {
          state.showLabels = control.checked;
          if (cy) {
            applyElementStyles();
            $("#cy").dataset.labels = state.showLabels ? "visible" : "hidden";
          }
          return;
        }
        if (control.id === "showDeprecatedToggle") state.showDeprecated = control.checked;
        if (control.id === "showChangesOnlyToggle") state.showChangesOnly = control.checked;
        refreshFilteredView();
      });
      $("#nodeInventory").addEventListener("click", (event) => {
        const button = event.target.closest("[data-node-id]");
        if (button) chooseNode(button.dataset.nodeId);
      });
      $("#fitButton").addEventListener("click", () => focusCurrent(false));
      $("#nodeSearch").addEventListener("input", (event) => {
        state.searchQuery = event.target.value || "";
        if (model) refreshFilteredView();
      });

      function testState() {
        const flowIds = selectedFlowIds();
        const selectedFlow = selectedFlowRecord();
        const allNodeIds = model.nodes.map((node) => node.id);
        const allEdgeIds = model.edges.map((edge) => edge.id);
        const visibleNodeIds = cy ? cy.nodes().map((node) => node.id()) : [];
        const visibleEdgeIds = cy ? cy.edges().map((edge) => edge.id()) : [];
        const emphasizedEdgeIds = cy ? cy.edges(".flow").map((edge) => edge.id()) : [];
        let reportedRootMeanY = rootMeanY;
        let reportedDownstreamMeanY = downstreamMeanY;
        if (cy && state.mode === "flow" && (!Number.isFinite(reportedRootMeanY) || !Number.isFinite(reportedDownstreamMeanY))) {
          const nodeSet = new Set(flowIds.nodeIds);
          const inDegree = new Map(flowIds.nodeIds.map((id) => [id, 0]));
          model.edges.filter((edge) => flowIds.edgeIds.includes(edge.id)
            && nodeSet.has(edge.source) && nodeSet.has(edge.target)).forEach((edge) => {
              inDegree.set(edge.target, (inDegree.get(edge.target) || 0) + 1);
            });
          const roots = flowIds.nodeIds.filter((id) => inDegree.get(id) === 0);
          const downstream = flowIds.nodeIds.filter((id) => !roots.includes(id));
          const meanY = (ids) => {
            const values = ids.map((id) => cy.getElementById(id).position("y")).filter(Number.isFinite);
            return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : undefined;
          };
          reportedRootMeanY = meanY(roots);
          reportedDownstreamMeanY = meanY(downstream);
        }
        return {
          mode: state.mode,
          flowId: state.flowId,
          selectedFlow: selectedFlow ? {id: selectedFlow.id, nodeIds: [...(selectedFlow.nodeIds || [])], edgeIds: [...(selectedFlow.edgeIds || [])]} : {nodeIds: [], edgeIds: []},
          allNodeIds,
          allEdgeIds,
          visibleNodeIds,
          visibleEdgeIds,
          flowNodeIds: [...flowIds.nodeIds],
          flowEdgeIds: [...flowIds.edgeIds],
          nonFlowEdgeIds: allEdgeIds.filter((id) => !flowIds.edgeIds.includes(id)),
          emphasizedEdgeIds,
          selectedNode: state.selectedNode,
          snapshotId: state.snapshotId,
          comparisonId: state.comparisonId,
          statusFilter: state.statusFilter,
          categoryFilter: state.categoryFilter,
          changeFilter: state.changeFilter,
          showLabels: state.showLabels,
          showDeprecated: state.showDeprecated,
          showChangesOnly: state.showChangesOnly,
          styles: styleTelemetry(),
          categoryColors: Object.fromEntries(model.categories.map((category) => [category.id, safeCategoryColor(category)])),
          fillColor: "#171922",
          layoutOptions: {...layoutOptions},
          largeFlow: $("#cy").dataset.largeFlow === "true",
          zoom: cy ? cy.zoom() : 0,
          fitCalls,
          fitCallsAfterSelection,
          fitPadding: lastFitPadding,
          rootMeanY: reportedRootMeanY,
          downstreamMeanY: reportedDownstreamMeanY,
          lastScrollBehavior,
        };
      }

      function exposeTestHooks() {
        if (!testMode) return;
        window.__projectMapTestHooks = {
          getState: testState,
        };
      }

      fetch(DATA_URL)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((data) => {
          model = normalizeModel(data);
          initializeState();
          renderLegend();
          renderModeControls();
          renderFilterControls();
          renderFlowNav();
          renderCurrentDetail();
          renderNodeInventory();
          initializeGraph();
          exposeTestHooks();
          $("#loading").classList.add("hidden");
        })
        .catch((error) => {
          $("#loading").innerHTML = `<div><strong>Project map could not load</strong><span>${escapeHtml(error.message)}. Serve this directory over HTTP and confirm the JSON file and pinned Cytoscape.js dependency are reachable.</span></div>`;
        });
    })();
  </script>
</body>
</html>
