name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate-skills.py
      - run: python scripts/context_budget_report.py --repo . --manifest context-budget-manifest.json --baseline context-budget-baseline.json --max-growth-bytes 0
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s evals/review-implementation-html -p "test_*.py" -v

  gpt-pro-loop-evals:
    name: gpt-pro-loop-evals (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-validate-packet
            os: ubuntu-latest
            suite: test_validate_packet.py
            test_filter: "*"
          - name: ubuntu-capture-snapshot
            os: ubuntu-latest
            suite: test_capture_snapshot.py
            test_filter: "*"
          - name: ubuntu-controller
            os: ubuntu-latest
            suite: test_gpc_loop.py
            test_filter: "*"
          - name: windows-validate-packet
            os: windows-latest
            suite: test_validate_packet.py
            test_filter: "*"
          - name: windows-capture-snapshot
            os: windows-latest
            suite: test_capture_snapshot.py
            test_filter: "*"
          - name: windows-controller-a-c
            os: windows-latest
            suite: test_gpc_loop.py
            test_filter: "*ControllerCase.test_[a-c]*"
          - name: windows-controller-d-i
            os: windows-latest
            suite: test_gpc_loop.py
            test_filter: "*ControllerCase.test_[d-i]*"
          - name: windows-controller-m-r
            os: windows-latest
            suite: test_gpc_loop.py
            test_filter: "*ControllerCase.test_[m-r]*"
          - name: windows-controller-s-u
            os: windows-latest
            suite: test_gpc_loop.py
            test_filter: "*ControllerCase.test_[s-u]*"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s evals/gpt-pro-codex-loop -p "${{ matrix.suite }}" -k "${{ matrix.test_filter }}" -v

  bash-4-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run codex-orchestration evaluations on Bash 4.4
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            bash:4.4.23-alpine3.22 \
            bash -c '
              apk add --no-cache coreutils findutils git openssl perl python3
              bash --version | head -1
              bash evals/codex-orchestration/run_all.sh
            '
